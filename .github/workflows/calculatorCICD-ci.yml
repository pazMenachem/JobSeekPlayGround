name: calculatorCICD CI Pipeline

# Triggers: When does this workflow run?
on:
  push:
    branches: [ main ]
    paths: 
      - 'calculatorCICD/**'
      - '.github/workflows/calculatorCICD-ci.yml'
  workflow_dispatch:

# Environment variables available to all jobs
env:
  PROJECT_PATH: calculatorCICD
  PYTHON_DEFAULT_VERSION: "3.12"

jobs:
  # Quality Checks and Testing
  test:
    name: "🧪 Tests & Quality Checks"
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-${{ hashFiles('calculatorCICD/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
          
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: 🔍 Lint with flake8
      run: |
        echo "🔍 Running flake8 linting..."
        flake8 src tests --format=github
        
    - name: 🎨 Check formatting with Black
      run: |
        echo "🎨 Checking code formatting..."
        black --check --diff src tests
        
    - name: 🔧 Type check with mypy
      run: |
        echo "🔧 Running type checking..."
        mypy src --ignore-missing-imports
        
    - name: 🧪 Run tests with pytest
      run: |
        echo "🧪 Running tests with coverage..."
        pytest -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=pytest-results.xml
        
    # Updated to actions/upload-artifact@v4
    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()  # Upload even if tests fail
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          calculatorCICD/pytest-results.xml
          calculatorCICD/htmlcov/
          calculatorCICD/coverage.xml
        retention-days: 30
        
    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == env.PYTHON_DEFAULT_VERSION
      with:
        file: ./calculatorCICD/coverage.xml
        flags: unittests
        name: calculatorCICD-coverage
        fail_ci_if_error: false

  # Security Scan (runs in parallel with tests)
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
        
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit[toml]
        
    - name: 🛡️ Check for known security vulnerabilities
      run: |
        echo "🛡️ Checking for known vulnerabilities in dependencies..."
        safety check --json --output safety-report.json || true
        
    - name: 🔍 Static security analysis
      run: |
        echo "🔍 Running static security analysis..."
        bandit -r src -f json -o bandit-report.json || true
        
    # Updated to actions/upload-artifact@v4
    - name: 📊 Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          calculatorCICD/safety-report.json
          calculatorCICD/bandit-report.json
        retention-days: 30

  # Simple Docker build job
  docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: test  # Only run if tests pass
    
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐳 Build Docker image
      run: |
        echo "Building Docker image..."
        docker build -t calculatorcicd:latest .
        
    - name: 🧪 Test Docker image
      run: |
        echo "Testing Docker image..."
        docker run --rm calculatorcicd:latest
        
    - name: ✅ Docker build successful
      run: echo "🎉 Docker image built and tested successfully!"

  # Build Summary (runs after tests complete)
  summary:
    name: "📋 Build Summary"
    runs-on: ubuntu-latest
    needs: [test, security]  # Wait for both test and security jobs
    if: always()  # Run even if previous jobs fail
    
    steps:
    # Updated to actions/download-artifact@v4
    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: 📊 Generate build summary
      run: |
        echo "# 🚀 calculatorCICD Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📊 Job Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Security**: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📁 Artifacts Generated" >> $GITHUB_STEP_SUMMARY
        echo "- Test results and coverage reports" >> $GITHUB_STEP_SUMMARY
        echo "- Security scan reports" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Review test coverage in the artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Check security reports for any issues" >> $GITHUB_STEP_SUMMARY
        
    - name: 📋 List all artifacts
      run: |
        echo "Generated artifacts:"
        find . -name "*.xml" -o -name "*.json" -o -name "*.html" | head -20

