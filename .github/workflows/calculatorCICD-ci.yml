name: calculatorCICD CI Pipeline

# Triggers: When does this workflow run?
on:
  push:
    branches: [ main ]
    paths: 
      - 'calculatorCICD/**'          # Only run when files in calculatorCICD folder change
      - '.github/workflows/calculatorCICD-ci.yml'  # Also run when this workflow file changes
  workflow_dispatch:                 # Allow manual triggering from GitHub UI

# Define the jobs to run
jobs:
  # Job 1: Quality Checks and Testing
  test:
    name: "Tests & Quality Checks"
    runs-on: ubuntu-latest           # Use Ubuntu virtual machine
    
    # Define the Python versions to test against
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    # Set working directory for all steps
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    # Step 1: Get the source code
    - name: Checkout code
      uses: actions/checkout@v4      # Official GitHub action to download code
      
    # Step 2: Set up Python environment
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    # Step 3: Cache pip dependencies for faster builds
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('calculatorCICD/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    # Step 4: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    # Step 5: Run linting with flake8
    - name: Lint with flake8
      run: |
        echo "🔍 Running flake8 linting..."
        flake8 src tests
        
    # Step 6: Check code formatting with Black
    - name: Check formatting with Black
      run: |
        echo "🎨 Checking code formatting..."
        black --check src tests
        
    # Step 7: Type checking with mypy
    - name: Type check with mypy
      run: |
        echo "🔧 Running type checking..."
        mypy src --ignore-missing-imports
        
    # Step 8: Run tests with pytest
    - name: Run tests with pytest
      run: |
        echo "🧪 Running tests with coverage..."
        pytest -v --cov=src --cov-report=xml --cov-report=term-missing
        
    # Step 9: Upload coverage to GitHub (optional, for viewing in PR)
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.12'  # Only upload once
      with:
        file: ./calculatorCICD/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false      # Don't fail CI if codecov fails
