name: calculatorCICD CI Pipeline

on:
  push:
    branches: [ main ]
    paths: 
      - 'calculatorCICD/**'
      - '.github/workflows/calculatorCICD-ci.yml'
  workflow_dispatch:

env:
  PROJECT_PATH: calculatorCICD
  PYTHON_DEFAULT_VERSION: "3.12"

jobs:
  test:
    name: "🧪 Tests & Quality Checks"
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-${{ hashFiles('calculatorCICD/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ matrix.python-version }}-
          
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: 🔍 Lint with flake8
      run: flake8 src tests
        
    - name: 🎨 Check formatting with Black
      run: black --check src tests
        
    - name: 🔧 Type check with mypy
      run: mypy src --ignore-missing-imports
        
    - name: 🧪 Run tests with pytest
      run: pytest -v --cov=src --cov-report=xml
        
    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}
        path: calculatorCICD/coverage.xml

  # Docker build job
  docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: test  # Only run if tests pass
    
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐳 Build Docker image
      run: |
        echo "Building Docker image..."
        docker build -t calculatorcicd:latest .
        
    - name: 🧪 Test Docker image
      run: |
        echo "Testing Docker image..."
        docker run --rm calculatorcicd:latest
        
    - name: ✅ Docker build successful
      run: echo "🎉 Docker image built and tested successfully!"
