name: calculatorCICD CI Pipeline

# Triggers: When does this workflow run?
on:
  push:
    branches: [ main ]
    paths: 
      - 'calculatorCICD/**'
      - '.github/workflows/calculatorCICD-ci.yml'
  workflow_dispatch:

# Environment variables available to all jobs
env:
  PROJECT_PATH: calculatorCICD
  PYTHON_DEFAULT_VERSION: "3.12"

jobs:
  # Quality Checks and Testing
  test:
    name: "🧪 Tests & Quality Checks"
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 📦 Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-py${{ matrix.python-version }}-${{ hashFiles('calculatorCICD/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-py${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
          
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: 🔍 Lint with flake8
      run: |
        echo "🔍 Running flake8 linting..."
        flake8 src tests --format=github
        
    - name: 🎨 Check formatting with Black
      run: |
        echo "🎨 Checking code formatting..."
        black --check --diff src tests
        
    - name: 🔧 Type check with mypy
      run: |
        echo "🔧 Running type checking..."
        mypy src --ignore-missing-imports
        
    - name: 🧪 Run tests with pytest
      run: |
        echo "🧪 Running tests with coverage..."
        pytest -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=pytest-results.xml
        
    # Updated to actions/upload-artifact@v4
    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()  # Upload even if tests fail
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          calculatorCICD/pytest-results.xml
          calculatorCICD/htmlcov/
          calculatorCICD/coverage.xml
        retention-days: 30
        
    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == env.PYTHON_DEFAULT_VERSION
      with:
        file: ./calculatorCICD/coverage.xml
        flags: unittests
        name: calculatorCICD-coverage
        fail_ci_if_error: false

  # Security Scan (runs in parallel with tests)
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
        
    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit[toml]
        
    - name: 🛡️ Check for known security vulnerabilities
      run: |
        echo "🛡️ Checking for known vulnerabilities in dependencies..."
        safety check --json --output safety-report.json || true
        
    - name: 🔍 Static security analysis
      run: |
        echo "🔍 Running static security analysis..."
        bandit -r src -f json -o bandit-report.json || true
        
    # Updated to actions/upload-artifact@v4
    - name: 📊 Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          calculatorCICD/safety-report.json
          calculatorCICD/bandit-report.json
        retention-days: 30

  # Simple Docker build job
  docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: test  # Only run if tests pass
    
    defaults:
      run:
        working-directory: ./calculatorCICD
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐳 Build Docker image
      run: |
        echo "Building Docker image..."
        docker build -t calculatorcicd:latest .
        
    - name: 🧪 Test Docker image
      run: |
        echo "Testing Docker image..."
        docker run --rm calculatorcicd:latest
        
    - name: ✅ Docker build successful
      run: echo "🎉 Docker image built and tested successfully!"

  # Build Summary (runs after tests complete)
  summary:
    name: "📋 Build Summary"
    runs-on: ubuntu-latest
    needs: [test, security, docker]  # Wait for both test and security jobs
    if: always()  # Run even if some jobs fail
    
    steps:
    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true  # Don't fail if no artifacts
      
    - name: 📊 Generate pipeline summary
      run: |
        echo "# 🚀 calculatorCICD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📊 Job Results" >> $GITHUB_STEP_SUMMARY
        echo "- **🧪 Tests & Quality**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **🐳 Docker Build**: ${{ needs.docker.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **🚀 Release & Deploy**: ${{ needs.release.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **🐳 Docker Publish**: ${{ needs.docker-publish.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Add status indicators
        echo "## 🎯 Pipeline Status" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ needs.test.result }}" == "success" && "${{ needs.docker.result }}" == "success" ]]; then
          echo "✅ **Core Pipeline**: All quality checks and Docker build passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Core Pipeline**: Some checks failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.release.result }}" == "success" ]]; then
          echo "🚀 **Release**: New version published" >> $GITHUB_STEP_SUMMARY
        elif [[ "${{ needs.release.result }}" == "skipped" ]]; then
          echo "⏭️ **Release**: No release needed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Release**: Release failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.docker-publish.result }}" == "success" ]]; then
          echo "🐳 **Docker**: Images tagged and ready" >> $GITHUB_STEP_SUMMARY
        elif [[ "${{ needs.docker-publish.result }}" == "skipped" ]]; then
          echo "⏭️ **Docker**: No publish needed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Docker**: Publish failed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📁 Generated Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Test results and coverage reports" >> $GITHUB_STEP_SUMMARY
        echo "- Python package builds (if released)" >> $GITHUB_STEP_SUMMARY
        echo "- Docker images (tagged with version)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🔄 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- Review test coverage and quality metrics" >> $GITHUB_STEP_SUMMARY
        echo "- Check release notes if new version was created" >> $GITHUB_STEP_SUMMARY
        echo "- Verify Docker images are properly tagged" >> $GITHUB_STEP_SUMMARY
        
    - name: 📋 List all artifacts
      run: |
        echo "📦 Pipeline Artifacts:"
        find . -name "*.xml" -o -name "*.whl" -o -name "*.tar.gz" -o -name "*.json" | head -20 || echo "No artifacts found"
        
    - name: 🎯 Final Status
      run: |
        if [[ "${{ needs.test.result }}" == "success" && "${{ needs.docker.result }}" == "success" ]]; then
          echo "🎉 Pipeline completed successfully!"
          exit 0
        else
          echo "⚠️ Pipeline completed with issues - check job results above"
          exit 1
        fi