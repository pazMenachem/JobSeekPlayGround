[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -m "not slow"
markers =
    unit: Unit tests
    integration: Integration tests
    webdriver: Tests that require WebDriver
    slow: Slow running tests
